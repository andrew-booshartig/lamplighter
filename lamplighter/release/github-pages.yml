# A GitHub Pages workflow for the website copy of the Lamplighter Project. NOT active here: nothing has been published.
# To use it: put the project in a public repository, save this file as .github/workflows/pages.yml, build the site folder
# first (python3 build.py && python3 -I lamplighter/tools/make_site.py --optional --limit-mib=1000)
# and commit it as a folder called site/ (or change `path:`). Put the zips from release/ in a GitHub Release, not in the repository (a release file may be up to 2 GiB; no total limit),
# then in the repository's Settings → Pages choose "GitHub Actions" as the source.
# The data folders are plain files; git blocks any file over 100 MiB (the largest here is 18.6 MiB) and the published site may be up to 1 GB (Git LFS cannot be used with Pages).
# NOTE (24 November 2026): the lean site, without the six optional shelves, was 1,356 MiB on 17 November and is 1,480 MiB now, over that 1 GB limit; the whole library (2,005 MiB) does not fit on GitHub Pages either.
# So this workflow needs a smaller site than make_site.py builds today (GITHUB_PREP.md says what the choices are); until then it stays a draft here, not in .github/workflows/.
name: Publish the Lamplighter Project
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
